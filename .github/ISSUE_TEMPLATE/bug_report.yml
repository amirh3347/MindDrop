name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MindDrop version
      description: Settings → About
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Samsung Galaxy A54, Android 14
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      options: [فارسی, English]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
