name: minddrop
description: "MindDrop — capture every thought before it slips away. A fast, offline, beautifully themed task inbox for Android."
publish_to: 'none'

# version: <build-name>+<build-number>
# CI overrides both when building a release from a git tag (see .github/workflows/release.yml).
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  flutter_local_notifications: ^19.0.0
  timezone: ">=0.9.4 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
